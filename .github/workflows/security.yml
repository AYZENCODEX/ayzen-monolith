name: AYZEN Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly: dependency audit + boundaries
    - cron: "43 2 * * *"   # nightly: gitleaks full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # W0-P1: full-history secret scan, baseline-aware. Blocking on PRs, pushes to main and nightly.
    # Runs the pinned upstream CLI image (not gitleaks-action) so --baseline-path works and no
    # org license secret is required. Local equivalent: .githooks/pre-commit (pnpm hooks:install).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config .gitleaks.toml \
                --baseline-path reports/gitleaks/baseline.json \
                --redact --verbose --exit-code 1 .

  security:
    if: github.event.schedule != '43 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret pattern scan
        run: |
          ! rg -n --hidden --glob '!pnpm-lock.yaml' --glob '!.git/**' \
            '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})' .
      - name: JavaScript syntax scan
        run: node scripts/src/check-all.ts --syntax-only
      - run: node scripts/validate-domain-boundaries.mjs