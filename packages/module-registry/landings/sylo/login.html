<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to Sylo</title><meta name="theme-color" content="#0f1213">
<style>/* Sign-in portal. Everything is scoped under .zp so it cannot leak into the app theme. */

@font-face{font-family:"Newsreader";font-weight:400;font-style:normal;font-display:swap;src:url(/landing-assets/sylo/fonts/newsreader-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:400;font-style:italic;font-display:swap;src:url(/landing-assets/sylo/fonts/newsreader-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url(/landing-assets/sylo/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(/landing-assets/sylo/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
.zp{
  --bg:#0f1213; --fg:#e9e3d3; --muted:rgba(233,227,211,.64); --dim:rgba(233,227,211,.44);
  --line:rgba(233,227,211,.12); --line-strong:rgba(233,227,211,.28);
  --teal:#74bba5; --violet:#c29a52; --pink:#e3c280; --danger:#ff8a8a; --ok:#7fe3a8;
  --glass:rgba(24,29,31,.72); --field:rgba(233,227,211,.045);
  --iri:linear-gradient(100deg,var(--teal),var(--violet) 55%,var(--pink));
  --serif:"Newsreader",Georgia,serif; --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  position:relative;isolation:isolate;min-height:100svh;overflow:clip;background:var(--bg);color:var(--fg);
  font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;color-scheme:dark;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.zp *,.zp *::before,.zp *::after{box-sizing:border-box}
.zp h1,.zp h2,.zp p{margin:0}
.zp-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.zp::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 40% 45%,transparent 38%,var(--bg) 100%),linear-gradient(180deg,rgba(15,18,19,.6),transparent 20%,transparent 62%,rgba(15,18,19,.9))}

/* brand column */
.zp-brand{display:flex;flex-direction:column;justify-content:space-between;padding:32px clamp(24px,4vw,56px) clamp(32px,6vh,64px)}
.zp-logo{display:flex;align-items:baseline;gap:14px;font:500 .95rem var(--sans);letter-spacing:.22em;text-decoration:none;color:var(--fg)}
.zp-logo small{font:400 .72rem var(--mono);letter-spacing:.06em;color:var(--dim)}
.zp-pitch{max-width:560px}
.zp-pitch h1{font:400 clamp(2.4rem,4.6vw,4.2rem)/1.03 var(--serif);letter-spacing:-.02em}
.zp-pitch h1 em{font-style:italic;background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent}
.zp-pitch p{margin-top:16px;color:var(--muted);max-width:46ch}
.zp-status{margin-top:22px;display:inline-flex;align-items:center;gap:.6em;font:400 .72rem var(--mono);letter-spacing:.05em;color:var(--muted)}
.zp-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:zp-blink 2.4s ease-in-out infinite}
@keyframes zp-blink{50%{opacity:.35}}

/* panel column */
.zp-stage{display:grid;place-items:center;padding:32px clamp(16px,3vw,48px)}
.zp-panel{width:min(100%,432px);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:28px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);position:relative}
.zp-panel::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;background:var(--iri);opacity:.7}
.zp-switch{position:absolute;top:-14px;right:18px}

/* tabs */
.zp-tabs{--n:2;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:3px;margin-bottom:24px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.zp-tabs button{position:relative;z-index:1;height:34px;border:0;background:none;color:var(--muted);font:500 .85rem var(--sans);border-radius:9px;cursor:pointer;transition:color .2s}
.zp-tabs button[aria-selected=true]{color:var(--fg)}
.zp-tabs button:hover{color:var(--fg)}
.zp-tabs i{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:9px;background:rgba(233,227,211,.1);box-shadow:inset 0 0 0 1px var(--line);transform:translateX(calc(var(--i)*100%));transition:transform .32s cubic-bezier(.2,.8,.2,1)}

.zp-heading{margin-bottom:20px}
.zp-heading h2{font:400 1.9rem/1.1 var(--serif);letter-spacing:-.01em}
.zp-heading p{margin-top:6px;color:var(--muted);font-size:.9rem}
.zp-form{display:grid;gap:16px}
.zp-view{animation:zp-in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes zp-in{from{opacity:0;transform:translateY(8px)}}

/* fields */
.zp-field-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.zp-field label{font:500 .82rem var(--sans);color:var(--muted)}
.zp-control{position:relative;display:flex;align-items:center}
.zp-control input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);
  font:400 .95rem var(--sans);outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.zp-control input::placeholder{color:var(--dim)}
.zp-control input:hover{border-color:var(--line-strong)}
.zp-control input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px rgba(116,187,165,.18);background:rgba(233,227,211,.06)}
.zp-field.is-invalid input{border-color:var(--danger)}
.zp-control:has(.zp-trail) input{padding-right:46px}
.zp-trail{position:absolute;right:4px;width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--dim);border-radius:8px;cursor:pointer}
.zp-trail:hover{color:var(--fg)}
.zp-trail:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.zp-trail svg{width:18px;height:18px}
.zp-hint{margin-top:6px;font-size:.78rem;color:var(--dim)}
.zp-error{margin-top:6px;font-size:.8rem;color:var(--danger)}
.zp-code input{height:56px;text-align:center;font:500 1.5rem var(--mono);letter-spacing:.5em;padding-left:.5em}
.zp-link{background:none;border:0;padding:0;color:var(--muted);font:500 .8rem var(--sans);cursor:pointer;text-decoration:none}
.zp-link:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.zp-link:disabled{opacity:.45;cursor:default;text-decoration:none}
.zp-link:focus-visible,.zp-check:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

/* checkbox */
.zp-check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;cursor:pointer;width:fit-content;background:none;border:0;padding:0;font-family:inherit}
.zp-check b{width:18px;height:18px;border-radius:5px;border:1px solid var(--line-strong);display:grid;place-items:center;transition:background .15s,border-color .15s}
.zp-check[aria-checked=true] b{background:var(--fg);border-color:var(--fg);color:#0f1213}
.zp-check svg{width:12px;height:12px;stroke-width:3}

/* buttons */
.zp-btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;height:46px;padding:0 22px;border-radius:999px;border:1px solid transparent;
  font:500 .92rem var(--sans);cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,opacity .2s;color:var(--fg);background:none;text-decoration:none}
.zp-btn svg{width:17px;height:17px}
.zp-btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.zp-btn:disabled{opacity:.55;cursor:not-allowed}
.zp-block{width:100%}
.zp-solid{background:#e9e3d3;color:#0f1213}
.zp-solid:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.12)}
.zp-ghost{border-color:var(--line);background:rgba(233,227,211,.03)}
.zp-ghost:not(:disabled):hover{border-color:var(--line-strong);background:rgba(233,227,211,.07)}
.zp-text{height:auto;padding:0;border-radius:6px;color:var(--muted);font-size:.8rem}
.zp-text:hover{color:var(--fg)}
.zp-spin{animation:zp-rot .8s linear infinite}
@keyframes zp-rot{to{transform:rotate(360deg)}}

.zp-divider{display:flex;align-items:center;gap:14px;margin:20px 0 16px;color:var(--dim);font-size:.78rem}
.zp-divider::before,.zp-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.zp-alt{display:grid;gap:10px}

/* notices */
.zp-notice{display:flex;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--field)}
.zp-notice-icon{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(116,187,165,.12);color:var(--teal)}
.zp-notice-icon svg{width:17px;height:17px}
.zp-notice-title{font:500 .88rem var(--sans)}
.zp-notice-body{margin-top:2px;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.zp-notice-warn{border-color:rgba(255,138,138,.3)}.zp-notice-warn .zp-notice-icon{background:rgba(255,138,138,.12);color:var(--danger)}
.zp-notice-ok{border-color:rgba(127,227,168,.3)}.zp-notice-ok .zp-notice-icon{background:rgba(127,227,168,.12);color:var(--ok)}
.zp-row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* step-up */
.zp-steps{display:grid;gap:10px}
.zp-step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,background .2s}
.zp-step.is-done{border-color:rgba(127,227,168,.35);background:rgba(127,227,168,.05)}
.zp-step-head{display:flex;justify-content:space-between;align-items:center;font:500 .88rem var(--sans)}
.zp-step-head em{font:400 .75rem var(--mono);font-style:normal;color:var(--ok)}
.zp-step-body{display:flex;gap:8px;margin-top:10px}
.zp-step-body input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:500 1rem var(--mono);letter-spacing:.3em;text-align:center;outline:0}
.zp-step-body input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px rgba(116,187,165,.18)}
.zp-step-body .zp-btn{height:40px;padding:0 16px;font-size:.85rem}

/* account chooser */
.zp-accounts{display:grid;gap:6px;margin-bottom:14px}
.zp-account{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px;transition:border-color .2s,background .2s}
.zp-account:hover{border-color:var(--line-strong);background:rgba(233,227,211,.04)}
.zp-account>button:first-child{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;border-radius:9px;font:inherit}
.zp-account>button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.zp-avatar{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--iri);color:#0f1213;font:600 .85rem var(--sans);text-transform:uppercase}
.zp-account strong{display:block;font:500 .9rem var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zp-account small{display:block;font-size:.76rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zp-account .zp-x{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--dim);border-radius:8px;cursor:pointer}
.zp-account .zp-x:hover{color:var(--danger)}
.zp-account .zp-x svg{width:15px;height:15px}

/* developer access */
.zp-dev{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.zp-dev summary{cursor:pointer;list-style:none;color:var(--dim);font:400 .78rem var(--sans);display:flex;align-items:center;gap:8px;width:fit-content}
.zp-dev summary::-webkit-details-marker{display:none}
.zp-dev summary::after{content:"+";font:500 1rem var(--mono)}
.zp-dev[open] summary::after{content:"–"}
.zp-dev summary:hover{color:var(--fg)}
.zp-dev summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.zp-dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.zp-dev-grid .zp-btn{height:38px;font-size:.8rem;padding:0 10px}
.zp-dev-grid .zp-btn:last-child{grid-column:1/-1}

.zp-foot{margin-top:24px;text-align:center;font-size:.85rem;color:var(--muted)}
.zp-foot button{background:none;border:0;padding:0;color:var(--fg);font:500 inherit var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.zp-foot button:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.zp-assure{margin-top:14px;text-align:center;font:400 .72rem var(--mono);color:var(--dim);letter-spacing:.02em}
.zp-boot{min-height:100svh;display:grid;place-items:center;background:#0f1213}
.zp-boot i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(233,227,211,.15);border-top-color:#74bba5;animation:zp-rot .8s linear infinite}
.zp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stepper */
.zp-stepper{margin-bottom:22px}
.zp-stepper ol{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.zp-stepper li{height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.zp-stepper li.is-done{background:var(--line-strong)}
.zp-stepper li.is-now{background:var(--iri)}
.zp-stepper p{font:400 .78rem var(--mono);color:var(--dim)}
.zp-suffix{position:absolute;right:14px;color:var(--dim);font:400 .85rem var(--mono);pointer-events:none}
.zp-control:has(.zp-suffix) input{padding-right:118px}
.zp-status-line{margin-top:6px;font-size:.8rem;min-height:1.2em;color:var(--dim)}
.zp-status-line.ok{color:var(--ok)}.zp-status-line.bad{color:var(--danger)}
.zp-mail{margin-top:6px;font:500 .82rem var(--mono);color:var(--muted);overflow-wrap:anywhere}

@media (max-width:899px){
  .zp{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .zp-brand{padding:22px 20px 0;gap:0}
  .zp-pitch{display:none}
  .zp-stage{align-items:start;padding:min(34svh,260px) 16px 32px}
  .zp-panel{padding:22px 20px}
  .zp-control input{font-size:16px}
  .zp-tabs button{font-size:.8rem}
}
@media (max-width:899px) and (max-height:700px){.zp-stage{padding-top:180px}}
@media (prefers-reduced-motion:reduce){
  .zp-view,.zp-status::before,.zp-spin{animation:none!important}
  .zp *{transition:none!important}
}

.zp-toast{position:fixed;right:20px;bottom:20px;z-index:2147483000;background:#0c0c14;border:1px solid rgba(233,227,211,.28);border-radius:12px;padding:12px 16px;max-width:320px;font-size:.88rem;animation:zp-in .25s;color:#e9e3d3}
.zp-toast.bad{border-color:rgba(255,138,138,.6);color:#ffb4b4}
.zp-ok-screen{display:grid;place-items:center;text-align:center;gap:12px;padding:30px 0}
.zp-ok-screen svg{width:44px;height:44px;color:var(--ok)}

@font-face{font-family:"Big Shoulders Display";font-weight:600;font-display:swap;src:url(/landing-assets/sylo/fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(/landing-assets/sylo/fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
/* Sylo: a vault, not an orbit. Square ledger card, brass rules, Big Shoulders caps. */
.zp{--display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;background:var(--bg)}
.zp{background-image:linear-gradient(rgba(194,154,82,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(194,154,82,.045) 1px,transparent 1px);background-size:44px 44px}
.zp-brand{align-items:flex-start}
.zp-logo span{font:800 1.5rem var(--display);letter-spacing:.14em;color:var(--pink)}
.zp-logo small{font:400 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.vault{width:min(46vh,380px);max-width:78%;align-self:center;margin:auto 0;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.vault .bolt{fill:var(--violet);fill-opacity:.7;transition:transform .8s cubic-bezier(.2,.8,.2,1),fill-opacity .6s}
.vault #dial{transform-origin:200px 200px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.vault .hub{transform-origin:200px 200px;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.vault.open .hub{transform:rotate(180deg)}
.vault.open .bolt{fill:var(--teal);fill-opacity:1}
.zp-pitch h1{font:800 clamp(2.6rem,5vw,4.6rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.zp-pitch h1 em{font:italic 400 .62em/1.1 var(--serif);text-transform:none;letter-spacing:0}
.zp-panel{border-radius:4px;background:var(--glass);border-color:var(--line-strong);box-shadow:0 0 0 1px rgba(194,154,82,.12),0 40px 90px -30px rgba(0,0,0,.9)}
.zp-panel::before{left:0;right:0;height:3px;background:var(--violet);opacity:1}
.zp-tabs{border-radius:3px;background:transparent}.zp-tabs button,.zp-tabs i{border-radius:2px}
.zp-tabs button{font:600 .8rem var(--display);letter-spacing:.14em;text-transform:uppercase}
.zp-heading h2{font:800 1.9rem/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.zp-field label{font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.zp-control input{border-radius:2px;background:rgba(0,0,0,.28);border-color:var(--line-strong);font-family:var(--mono);font-size:.9rem}
.zp-btn{border-radius:2px;font:600 .95rem var(--display);letter-spacing:.14em;text-transform:uppercase}
.zp-solid{background:var(--violet);color:#0f1213}
.zp-ghost{background:transparent;border-color:var(--line-strong)}
.zp-step,.zp-notice,.zp-account{border-radius:3px}
.zp-toast{border-radius:3px}
@media(max-width:899px){.vault{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:150px;margin:0;opacity:.9}}
@media(prefers-reduced-motion:reduce){.vault *{transition:none!important}}
</style></head>
<body style="margin:0;background:#0f1213">

const B64={e:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),d:s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer}},pkOK=!!(window.PublicKeyCredential&&navigator.credentials);

root.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{const i=$(`[data-code="${b.dataset.v}"]`);if(i.value.length!==6){toast("Enter the 6-digit code.",true);return}b.disabled=true;const r=await api("/login/verify",{challenge:L.ch,code:i.value});if(!r.ok){b.disabled=false;toast(say(r),true);if(r.d.code==="CHALLENGE_INVALID"){S.li=null;render()}else i.value="";return}keep(r.d.token,S.email);L.done.push(b.dataset.v);after()});
const pkb=$("[data-pk]");if(pkb)pkb.onclick=async()=>{pkb.disabled=true;pkb.textContent="Waiting for passkey…";if(await pkLogin(L)){L.done.push("passkey");after()}else{pkb.disabled=false;pkb.innerHTML=fp+" Verify with passkey"}};
const alt=$("#alt");if(alt)alt.onclick=async()=>{L.i=((L.i||0)+1)%L.all.length;L.req=[L.all[L.i]];if(L.req[0]==="email_otp"){const r=await api("/login/email-code",{challenge:L.ch});toast(r.ok?"We sent a code to your email.":say(r),!r.ok)}stepup()};
$("#back").onclick=()=>{S.li=null;render()}}
async function after(){if(S.li.done.length===S.li.req.length){success("Account verified!","Opening your vault…")}else stepup()}
function success(t,s){root.innerHTML=`<div class="zp-ok-screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><h2 style="font:400 1.9rem var(--serif)">${t}</h2><p style="color:var(--muted)">${s}</p><a class="zp-btn zp-ghost" href="${esc(NEXT)}">Continue</a></div>`;setTimeout(()=>location.assign(NEXT),1600)}
/* ---- reset ---- */
function reset(){const n=S.rs;
view(n===1?`<form class="zp-form" id="f">${head("Reset your password","Enter your email and we'll send a code.")}${field({id:"email",label:"Email",type:"email",value:S.email,ph:"you@company.com",attrs:"required autocomplete=username"})}${btn("Send code",{type:"submit"})}${btn("← Back to sign in",{v:"text",id:"back",block:false})}</form>`:`<form class="zp-form" id="f">${head("Choose a new password","Enter the code sent to "+esc(S.email)+".")}${field({id:"code",label:"6-digit code",cls:"zp-code",ph:"······",attrs:"maxlength=6 inputmode=numeric autocomplete=one-time-code required"})}${field({id:"pw",label:"New password",type:"password",attrs:"required minlength=10 autocomplete=new-password",hint:"At least 10 characters.",trail:passBtn("eye")})}${btn("Update password",{type:"submit"})}${btn("← Back to sign in",{v:"text",id:"back",block:false})}</form>`,false);
if(n===2){bindPass("eye","pw");$("#code").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"")}
$("#back").onclick=()=>{S.rs=0;render()};
$("#f").onsubmit=async e=>{e.preventDefault();if(n===1){S.email=val("email");await api("/reset/request",{email:S.email});toast("If that address has an account, a code is on its way.");S.rs=2;reset()}else{const r=await api("/reset/confirm",{email:S.email,code:val("code"),password:val("pw")});if(!r.ok){toast(say(r),true);return}toast("Password updated. Sign in with it now.");S.rs=0;render()}}}
/* ---- sign up ---- */
function signup(){const n=S.su;let h="";
if(n===0)h=`<form class="zp-form" id="f">${head("Create your account","Start with your email and a password.")}${field({id:"email",label:"Email",type:"email",value:S.email,ph:"you@company.com",attrs:"required autocomplete=email"})}${field({id:"pw",label:"Password",type:"password",value:S.pw,attrs:"required minlength=10 autocomplete=new-password",hint:"At least 10 characters.",trail:passBtn("eye")})}${btn("Continue",{type:"submit"})}</form>`;
if(n===1){ensureCap();h=`<form class="zp-form" id="f">${head("One quick check","Add a referral code if you have one, then prove you're human. We email a code next.")}${field({id:"ref",label:"Referral code (optional)",value:S.ref,ph:"AYZNXXXXXX",attrs:'autocapitalize=characters spellcheck=false'})}${field({id:"cap",label:"Security check: "+S.cap.q+" = ?",type:"number",ph:"Your answer",attrs:"required inputmode=numeric",aside:'<button type="button" class="zp-link" id="newq">New question</button>'})}${btn("Send verification code",{type:"submit"})}${btn("← Back",{v:"text",id:"back",block:false})}</form>`}
if(n===2)h=`<form class="zp-form" id="f">${head("Verify your email")}<div class="zp-notice zp-notice-ok"><div><p class="zp-notice-title">Code sent to</p><p class="zp-notice-body">${esc(S.email)}.</p></div></div>${field({id:"code",label:"6-digit code",cls:"zp-code",ph:"······",attrs:'maxlength=6 inputmode=numeric autocomplete=one-time-code required'})}${btn("Verify email",{type:"submit"})}<div class="zp-row"><button type="button" class="zp-link" id="back">← Change email</button><button type="button" class="zp-link" id="resend">Resend code</button></div></form>`;
if(n===3)h=`<form class="zp-form" id="f">${head("Choose your identity","Your username also becomes your AYZEN mail address.")}<div>${field({id:"user",label:"Username",value:S.user,ph:"your_handle",attrs:'required minlength=3 autocapitalize=none spellcheck=false'})}<p class="zp-status-line" id="us">3-30 lowercase letters, numbers or underscores.</p></div>${field({id:"name",label:"Full name",value:S.name,ph:"Your name",attrs:"required maxlength=60"})}<div>${field({id:"mail",label:"AYZEN mail address",value:S.mail,attrs:"autocapitalize=none spellcheck=false",trail:'<span class="zp-suffix">@ayzen.tech</span>'})}<p class="zp-status-line" id="ms"></p></div>${btn("Create account",{type:"submit",id:"go"})}</form>`;
if(n===4)h=`<form class="zp-form" id="f">${head("Finish your profile","Everything here is optional. You can change it later.")}${field({id:"loc",label:"Location",ph:"City, country"})}${field({id:"bio",label:"Short bio",ph:"What you work on",attrs:"maxlength=300"})}${field({id:"x",label:"X (Twitter) handle",ph:"@handle"})}${field({id:"tg",label:"Telegram username",ph:"@handle"})}${field({id:"dc",label:"Discord",ph:"username"})}${field({id:"web",label:"Website",type:"url",ph:"https://"})}<p class="zp-status-line">Security (optional)</p>${btn("Set up authenticator app",{v:"ghost",id:"totpadd"})}${btn("Add a passkey",{v:"ghost",id:"pkadd"})}${btn("Save and continue",{type:"submit"})}${btn("Skip for now",{v:"ghost",id:"skip"})}</form>`;
view((n<4?"":"")+stepper()+h,n<4);if(n===4){/* hide tabs on profile */}
if(n===0)bindPass("eye","pw");
const f=$("#f");
f.onsubmit=async e=>{e.preventDefault();
if(n===0){if(val("pw").length<10){toast("Use at least 10 characters.",true);return}S.email=val("email");S.pw=val("pw");S.su=1;signup()}
else if(n===1){S.ref=val("ref").toUpperCase().trim();const sb=$("#f .zp-btn");sb.disabled=true;
if(S.ref){const rr=await api("/referral/check",{code:S.ref});if(!rr.d.valid){sb.disabled=false;toast("That referral code is not valid.",true);return}}
const r=await api("/signup/start",{email:S.email,captcha:{id:S.cap.id,answer:val("cap")}});
if(!r.ok){toast(say(r),true);if(r.d.code==="INVALID_CAPTCHA")S.cap=null;signup();return}
S.cap=null;S.su=2;toast("If this address can be used, a code is on its way.");signup()}
else if(n===2){if(val("code").length!==6){toast("Enter the 6-digit code.",true);return}const r=await api("/signup/verify",{email:S.email,code:val("code")});if(!r.ok){toast(say(r),true);return}S.code=val("code");S.su=3;signup()}
else if(n===3){S.user=val("user");S.name=val("name");S.mail=val("mail");$("#go").textContent="Creating…";const nm=S.name.trim().split(/\s+/);
const r=await api("/signup/complete",{email:S.email,code:S.code,password:S.pw,username:S.user,mail:S.mail||undefined,referral:S.ref||undefined,profile:{firstName:nm[0],lastName:nm.slice(1).join(" ")||undefined}});
if(!r.ok){$("#go").textContent="Create account";toast(say(r),true);if(r.d.code==="INVALID_CODE"){S.su=2;signup()}return}
keep(r.d.token,S.email,S.user);S.su=4;if(S.mail)toast(S.mail+"@ayzen.tech is yours.");signup()}
else{const nm=S.name.trim().split(/\s+/),web=val("web"),g=id=>val(id).trim();
await api("/profile",{firstName:nm[0],lastName:nm.slice(1).join(" ")||undefined,location:g("loc"),bio:g("bio"),links:/^https?:\/\//i.test(web)?[web]:[],extra:{x:g("x"),telegram:g("tg"),discord:g("dc")}},"PUT");
success("Account created!","Welcome, "+esc(S.name||S.user)+". Opening your vault…")}};
if(n===1){$("#newq").onclick=()=>{S.cap=null;signup()};$("#back").onclick=()=>{S.su=0;signup()}}
if(n===2){$("#back").onclick=()=>{S.su=0;signup()};$("#resend").onclick=()=>{S.su=1;S.cap=null;toast("Solve the check again to get a new code.");signup()};$("#code").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"")}
if(n===4){$("#totpadd").onclick=()=>enrolTotp(()=>{});$("#pkadd").onclick=()=>enrolPasskey(()=>{})}
if(n===4)$("#skip").onclick=()=>success("Account created!","Welcome, "+esc(S.name||S.user)+". Opening your vault…");
if(n===3){const u=$("#user"),m=$("#mail"),us=$("#us"),ms=$("#ms");let tu,tm;
const chk=(el,v,box,mail)=>{clearTimeout(mail?tm:tu);if(v.length<3){box.className="zp-status-line";box.textContent=mail?"At least 3 characters.":"3-30 lowercase letters, numbers or underscores.";return}box.className="zp-status-line";box.textContent="Checking…";const t=setTimeout(async()=>{const r=await api(mail?"/mail/check":"/username/check",mail?{mail:v}:{username:v});const bad=!r.ok||!r.d.available;box.className="zp-status-line "+(bad?"bad":"ok");box.textContent=!r.ok?say(r):bad?(mail?"Already taken.":"That username is taken."):(mail?v+"@ayzen.tech is available.":"Available.")},350);mail?tm=t:tu=t};
u.oninput=()=>{u.value=u.value.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);S.user=u.value;if(!S.mailTouched){m.value=u.value.replace(/[^a-z0-9._-]/g,"");S.mail=m.value;chk(m,m.value,ms,true)}chk(u,u.value,us,false)};
m.oninput=()=>{S.mailTouched=true;m.value=m.value.toLowerCase().replace(/[^a-z0-9._-]/g,"").slice(0,30);S.mail=m.value;chk(m,m.value,ms,true)};
if(u.value)u.oninput()}}
render();
})();
</script>
