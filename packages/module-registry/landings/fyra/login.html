<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1428"><title>Sign in to Fyra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--night:#0a1428;--night2:#10203d;--ink:#0f1b2d;--navy:#12233f;--brass:#d6a54c;--steel:#7a9ad8;--paper:#f5f7fa;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;--serif:'Playfair Display',Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--night);color:#e9eef7;font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}h1,h2,h3,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.bgf{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 55% at 22% 38%,rgba(122,154,216,.16),transparent 70%),radial-gradient(50% 50% at 88% 90%,rgba(214,165,76,.1),transparent 70%),linear-gradient(rgba(122,154,216,.055) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(122,154,216,.055) 1px,transparent 1px) 0 0/64px 64px;-webkit-mask-image:radial-gradient(90% 90% at 50% 45%,#000 40%,rgba(0,0,0,.35));mask-image:radial-gradient(90% 90% at 50% 45%,#000 40%,rgba(0,0,0,.35));animation:drift 24s ease-in-out infinite alternate}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px max(24px,calc((100vw - 1240px)/2))}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.07em}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#12233f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.mark svg{width:17px;height:17px}
.bk{font-size:13px;color:rgba(233,238,247,.6);transition:color .3s}.bk:hover{color:#fff}
.stage{min-height:calc(100svh - 80px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,450px);gap:clamp(32px,6vw,96px);align-items:center;padding:10px max(24px,calc((100vw - 1240px)/2)) 56px}
h1{font:500 clamp(46px,5.6vw,84px)/.98 var(--serif);letter-spacing:-.045em}h1 .ln{display:block;overflow:hidden;padding:0 .06em .14em 0;margin-bottom:-.14em}h1 .ln>span{display:block;transform:translateY(106%);animation:rise 1.15s cubic-bezier(.2,.7,.1,1) .1s forwards}h1 .ln:nth-child(2)>span{animation-delay:.24s;color:rgba(233,238,247,.55)}
.lead{margin:26px 0 30px;max-width:470px;font-size:16px;line-height:1.75;color:rgba(233,238,247,.66);animation:fi .9s ease .6s both}
/* ledger */
.ledger{position:relative;height:300px;max-width:640px;perspective:1100px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(180deg,transparent,#000 24%,#000 76%,transparent);animation:fi 1.2s ease .8s both}
.plane{position:absolute;left:0;right:0;top:-40px;height:560px;transform-origin:50% 0;transform:rotateX(46deg);overflow:hidden;animation:tilt 1.6s cubic-bezier(.2,.8,.2,1) .8s both;border-top:1px solid rgba(233,238,247,.12)}
.r{display:grid;grid-template-columns:58px 1.2fr 1.2fr 96px;gap:14px;height:44px;align-items:center;padding:0 16px;font:12.5px var(--mono);color:rgba(214,226,248,.42);border-bottom:1px solid rgba(233,238,247,.07);transition:color .35s,background .5s;position:relative}
.r .am{text-align:right;font-variant-numeric:tabular-nums}.r .cr:before{content:'→ ';color:rgba(233,238,247,.25)}.r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.on{color:#f6e3b8;background:linear-gradient(90deg,rgba(214,165,76,.24),rgba(214,165,76,.04))}.r.on:after{content:'✓';position:absolute;right:-26px;color:#5cc3a1;font-size:14px}.r.on:before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--brass)}
.scan{position:absolute;left:0;right:0;top:264px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,165,76,.7),transparent);box-shadow:0 0 24px 2px rgba(214,165,76,.4);pointer-events:none}
.hud{margin:6px 0 0;font-size:13px;color:rgba(233,238,247,.6);animation:fi 1s ease 1.2s both}.hud b{font:500 13px var(--mono);color:var(--brass)}.hud small{display:block;font-size:12px;color:rgba(233,238,247,.4);margin-top:2px}
/* sheet */
.sheet{--fg:#0f1b2d;--mut:rgba(15,27,45,.68);--dim:rgba(15,27,45,.48);--line:rgba(15,27,45,.17);--ok:#1f7a5f;--bad:#c4452f;--lk:#8a5d0d;position:relative;background:var(--paper);color:var(--fg);border-radius:6px;padding:36px 36px 22px;min-height:600px;display:flex;flex-direction:column;box-shadow:0 50px 110px -30px rgba(0,0,0,.65);animation:sl 1s cubic-bezier(.2,.8,.2,1) .3s both}
.sheet:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;border-radius:6px 6px 0 0;background:linear-gradient(90deg,#274a87,#d6a54c)}
#av{flex:1;display:flex;flex-direction:column;gap:16px}#av>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}#av>:nth-child(2){animation-delay:.04s}#av>:nth-child(3){animation-delay:.08s}#av>:nth-child(4){animation-delay:.12s}#av>:nth-child(n+5){animation-delay:.16s}#av.sh{animation:sh .4s}
#av h3{font:500 30px/1.1 var(--serif);letter-spacing:-.03em}#av h3:after{content:'';display:block;width:54px;height:4px;margin-top:14px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}.sb{color:var(--mut);font-size:14px;margin-top:-4px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}.tabs button{position:relative;padding:8px 0 12px;border:0;background:none;color:var(--mut);font:500 14px var(--sans);cursor:pointer;transition:color .25s}.tabs button:hover{color:var(--fg)}.tabs .on{color:var(--fg)}.tabs .on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--navy)}
form{display:flex;flex-direction:column;gap:16px}.fl label{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-bottom:2px}
.ai{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:10px 2px;color:var(--fg);font:400 16px var(--sans);transition:border-color .25s,box-shadow .25s}.ai::placeholder{color:var(--dim)}.ai:focus{outline:0;border-color:var(--navy);box-shadow:0 1px 0 var(--navy)}
.pw{position:relative}.pw .ai{padding-right:60px}.pw button{position:absolute;right:0;top:6px;bottom:6px;padding:0 4px;border:0;background:none;color:var(--mut);font:500 12.5px var(--sans);cursor:pointer}.pw button:hover{color:var(--fg)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mut)}.ck{display:flex;gap:9px;align-items:center;cursor:pointer}.ck input{accent-color:var(--navy);width:16px;height:16px}
.lk{background:none;border:0;padding:0;color:var(--lk);font:600 13px var(--sans);cursor:pointer}.lk:hover{text-decoration:underline}.lk:disabled{color:var(--dim);cursor:default;text-decoration:none}
.hn{font-size:12px;color:var(--dim)}.hn.bad{color:var(--bad)}.hn.bad:empty{display:none}
.b1,.b2{position:relative;overflow:hidden;width:100%;border-radius:6px;padding:14px;font:600 15px var(--sans);cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s}
.b1{border:0;background:var(--navy);color:#fff;box-shadow:0 10px 24px -12px rgba(18,35,63,.7)}.b1:hover:not(:disabled){background:#1b3a73;transform:translateY(-1px)}.b1:disabled{opacity:.4;cursor:not-allowed}.b1:after{content:'';position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--brass);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s}.b1:hover:not(:disabled):after{transform:scaleX(1)}
.b1.ld{color:transparent}.b1.ld:before{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.b2{border:1px solid var(--line);background:#fff;color:var(--fg);display:block;text-align:center}.b2:hover{border-color:var(--navy);background:#fff}.b2.ay{border-color:rgba(18,35,63,.4)}.hf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b2 svg{width:18px;height:18px;vertical-align:-4px;margin-right:9px}.b2.ay svg{fill:none}
.dv{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim)}.dv:before,.dv:after{content:'';flex:1;height:1px;background:var(--line)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.otp input{height:52px;text-align:center;font:500 22px var(--mono);padding:0;border:1.5px solid var(--line);border-radius:6px;background:#fff}.otp input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,35,63,.12)}.otp input.pp{animation:pop .25s}
.sm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.sm i{height:3px;border-radius:2px;background:var(--line);transition:background .3s}.sm i.s1{background:var(--bad)}.sm i.s2{background:#d6a54c}.sm i.s3{background:var(--ok)}
.fx{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fff}.fx.ok{border-color:rgba(31,122,95,.5);background:rgba(31,122,95,.06)}.fx header{display:flex;justify-content:space-between;font-size:13px}.fx header span{color:var(--dim)}
.os{display:grid;gap:14px;margin:10px 0}.os li{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--dim);transition:color .3s}.os li i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;position:relative}.os li.c{color:var(--fg)}.os li.c i{border-color:var(--navy);border-top-color:transparent;animation:spin .8s linear infinite}.os li.d{color:var(--mut)}.os li.d i{background:var(--ok);border-color:var(--ok)}.os li.d i:after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}.os li.x{color:var(--bad)}.os li.x i{border-color:var(--bad)}
.cl{margin-top:auto;padding-top:14px;text-align:center;font-size:12px;color:var(--dim)}
.ckc{width:76px;height:76px;margin:30px auto 6px;border-radius:50%;border:2px solid var(--ok);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,.8,.2,1)}.ckc svg{width:34px;height:34px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:dr .6s .25s forwards}
.dn{text-align:center}.dn h3:after{margin-left:auto;margin-right:auto}.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;background:var(--navy);width:0;animation:fill 1.5s linear forwards}
#ts{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:6px;background:#12233f;color:#fff;font-size:13px;transition:all .4s;max-width:90vw}#ts.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{to{transform:none}}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes sl{from{opacity:0;transform:translateX(26px)}}@keyframes tilt{from{transform:rotateX(78deg)}}@keyframes drift{to{background-position:0 0,0 0,28px 20px,28px 20px}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:none;opacity:1}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes fill{to{width:100%}}
@media(max-width:980px){.stage{grid-template-columns:1fr;gap:36px}.sheet{max-width:520px;min-height:0}.ledger{height:230px}}
@media(max-width:640px){.ledger,.hud{display:none}.lead{margin-bottom:0}.sheet{padding:30px 22px 20px}.top{padding:18px 20px}.stage{padding:6px 20px 40px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}h1 .ln>span{transform:none}}
</style></head><body>
<div class="bgf" aria-hidden="true"></div>
<header class="top"><a class="brand" href="/fyra/" aria-label="Fyra home"><i class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#m"/></svg></i>fyra</a><a class="bk" href="/fyra/">← Back to overview</a></header>
<main class="stage"><section><h1><span class="ln"><span>Every entry,</span></span><span class="ln"><span>accounted for.</span></span></h1>
<p class="lead">Fyra is the finance workspace inside AYZEN. Sign in to your ledger, books and reports, where every debit meets its credit and nothing is left unexplained.</p>
<div class="ledger" id="lg" role="img" aria-label="Illustrative ledger entries scrolling past a reconciliation line. Each entry's debit equals its credit. No live data."><div class="plane"><div id="trk"></div><div class="scan"></div></div></div>
<p class="hud" id="hud">Reconciling entries</p><p class="hud"><small>Illustrative entries. No live account data.</small></p></section>
<section class="sheet" id="sheet" aria-label="Sign in to Fyra"><div id="av"></div></section></main><div id="ts" role="status"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="m"><rect x="2" y="12" width="4.2" height="10" rx="1.2" fill="#e0b25a"/><rect x="9.6" y="6" width="4.2" height="16" rx="1.2" fill="#fbfcfd"/><rect x="17.2" y="2" width="4.2" height="20" rx="1.2" fill="#6f97e0"/></g></defs></svg>
<script>(()=>{
const $=(q,r=document)=>r.querySelector(q),av=$('#av'),red=matchMedia('(prefers-reduced-motion:reduce)').matches;
const DEMO=['demoadmin@ayzen.io','demo@ayzen.io'],emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const q=new URLSearchParams(location.search),nx=q.get('next'),NEXT=nx&&/^\/(?!\/)/.test(nx)?nx:'/finance';
/* Google/GitHub: set a start URL once the provider route exists on your API, e.g. google:'/api/auth/google/start'. null shows a clear message instead of a dead link. */
const SOCIAL={google:window.FYRA_GOOGLE_URL||null,github:window.FYRA_GITHUB_URL||null};
const OIDC={issuer:(window.FYRA_OIDC_ISSUER||location.origin).replace(/\/+$/,''),client:window.FYRA_OIDC_CLIENT_ID||'workspace',scopes:'openid profile email',key:'ayzen_sylo_oidc_pending'};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
function oidcFail(m){const l=[...av.querySelectorAll('.os li')],i=l.findIndex(x=>x.classList.contains('c'));l.forEach((x,k)=>{if(k===i)x.className='x'});err(m);const b=$('#ob');if(b)b.hidden=false}
async function startOidc(){render('oidc.run');const st=n=>[...av.querySelectorAll('.os li')].forEach((l,i)=>l.className=i<n?'d':i===n?'c':'');st(0);
 try{const r=await fetch(OIDC.issuer+'/.well-known/openid-configuration');if(!r.ok)throw 0;const md=await r.json();if(!md.authorization_endpoint)throw 0;await new Promise(z=>setTimeout(z,350));st(1);
  const verifier=rnd(32),chal=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))),state=rnd(16),nonce=rnd(16);
  sessionStorage.setItem(OIDC.key,JSON.stringify({state,codeVerifier:verifier,nonce,clientId:OIDC.client,returnToPath:NEXT,createdAt:Date.now()}));
  const u=new URLSearchParams({response_type:'code',client_id:OIDC.client,redirect_uri:location.origin+'/oidc/callback',scope:OIDC.scopes,state,code_challenge:chal,code_challenge_method:'S256',nonce});
  await new Promise(z=>setTimeout(z,450));st(2);await new Promise(z=>setTimeout(z,450));location.assign(md.authorization_endpoint+'?'+u)}
 catch{oidcFail('Could not reach the AYZEN provider. Try again, or use email and password.')}}
const S={v:'',email:'',pending:null,step:null,cd:0,t:null,keep:true};
/* --- helpers --- */
async function api(p,b){try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=null;try{d=await r.json()}catch{}return{ok:r.ok,status:r.status,data:d}}catch{return{ok:false,status:0,data:null}}}
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function err(m){const e=$('#er');if(e)e.textContent=m;av.classList.remove('sh');void av.offsetWidth;av.classList.add('sh')}
function busy(b,on){if(!b)return;b.classList.toggle('ld',on);b.disabled=on}
const str=p=>{let n=0;if(p.length>=10)n++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))n++;if(/\d/.test(p))n++;if(/[^A-Za-z0-9]/.test(p))n++;return p.length<6?0:Math.max(1,n)};
function store(u,t,keep){for(const s of[localStorage,sessionStorage]){s.removeItem('ayzen_user');s.removeItem('ayzen_token')}const s=keep?localStorage:sessionStorage;s.setItem('ayzen_user',JSON.stringify(u));s.setItem('ayzen_token',t)}
function finish(d){store(d.user,d.token,S.keep);render('done',d.user&&d.user.username)}
/* --- templates --- */
const tabs=m=>`<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${m==='in'}" class="${m==='in'?'on':''}" data-act="go" data-v="in.cred">Sign in</button><button type="button" role="tab" aria-selected="${m==='up'}" class="${m==='up'?'on':''}" data-act="go" data-v="up.form">Sign up</button></div>`;
const fld=(l,id,t,ph,x='')=>`<div class="fl"><label for="${id}">${l}</label><input class="ai" id="${id}" type="${t}" placeholder="${ph}" ${x}></div>`;
const pwf=(l,id,ac)=>`<div class="fl"><label for="${id}">${l}</label><div class="pw"><input class="ai" id="${id}" type="password" placeholder="••••••••••" autocomplete="${ac}"><button type="button" data-act="eye" data-t="${id}" aria-label="Show or hide password">Show</button></div></div>`;
const box=()=>'<div class="otp">'+'<input class="ai" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit">'.repeat(6)+'</div>';
const GI='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h5.9a5.04 5.04 0 0 1-2.19 3.31v2.75h3.54c2.07-1.91 3.25-4.72 3.25-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.54-2.75c-.98.66-2.24 1.05-3.74 1.05-2.87 0-5.3-1.94-6.17-4.55H2.17v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.83 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.17a11 11 0 0 0 0 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.36c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.1 14.97 1 12 1A11 11 0 0 0 2.17 7.07l3.66 2.84C6.7 7.3 9.13 5.36 12 5.36z"/></svg>',
HI='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>';
const social=()=>`<button type="button" class="b2 ay" data-act="ayzen"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#m"/></svg>Login with AYZEN</button><div class="hf"><button type="button" class="b2" data-act="oa" data-p="google">${GI}Google</button><button type="button" class="b2" data-act="oa" data-p="github">${HI}GitHub</button></div>`;
const foot='<div class="cl">Secured by AYZEN sign-in</div>';
const V={
'in.cred':()=>`${tabs('in')}<h3>Welcome back</h3><p class="sb">Sign in to open your finance workspace.</p><form data-f="login" novalidate>${fld('Email','e','email','you@company.com','autocomplete="email" value="'+esc(S.email)+'"')}${pwf('Password','p','current-password')}<div class="rw"><label class="ck"><input type="checkbox" id="keep" ${S.keep?'checked':''}> Keep me signed in</label><button type="button" class="lk" data-act="go" data-v="rst.email">Forgot password?</button></div><div class="hn bad" id="er" role="alert"></div><button class="b1" type="submit">Sign in</button></form><div class="dv">or</div>${social()}${foot}`,
'in.otp':()=>`<h3>Check your email</h3><p class="sb">We sent a 6-digit code to ${esc(S.email)}.</p>${box()}<div class="hn bad" id="er" role="alert"></div><button class="b1" id="vb" data-act="verify" disabled>Verify and sign in</button><div class="rw"><span class="hn">Code expires after a few minutes.</span><button class="lk" data-act="resend" id="rs">Resend code</button></div>${foot}`,
'in.step':()=>{const r=S.step.req,d=S.step.done,row=(k,t,s)=>`<div class="fx ${d.includes(k)?'ok':''}" data-k="${k}"><header><b>${t}</b><span>${d.includes(k)?'Verified':s}</span></header>${d.includes(k)?'':box()}</div>`;
 return `<h3>Confirm it’s you</h3><p class="sb">This looks like a new sign-in location. Clear each check to continue.</p>${r.includes('email_otp')?row('email_otp','Email code','Sent to your inbox'):''}${r.includes('totp')?row('totp','Authenticator code','From your app'):''}${r.some(k=>!['email_otp','totp'].includes(k))?'<p class="hn">Passkey and backup-code checks are handled on the <a class="lk" href="/login">AYZEN sign-in page</a>.</p>':''}<div class="hn bad" id="er" role="alert"></div><button class="b1" id="vb" data-act="stepgo" disabled>Verify</button><button class="lk" data-act="go" data-v="in.cred" style="align-self:center">Back to sign in</button>${foot}`},
'up.form':()=>`${tabs('up')}<h3>Create your account</h3><p class="sb">One AYZEN account works across every module.</p><form data-f="signup" novalidate>${fld('Username','u','text','yourname','autocomplete="username"')}${fld('Email','e','email','you@company.com','autocomplete="email" value="'+esc(S.email)+'"')}${pwf('Password','p','new-password')}<div class="sm" id="sm"><i></i><i></i><i></i><i></i></div><div class="hn" id="pm">At least 6 characters; 10+ with upper and lower case, a number and a symbol is stronger.</div><div class="hn bad" id="er" role="alert"></div><button class="b1" type="submit">Send verification code</button></form><div class="dv">or</div>${social()}${foot}`,
'up.otp':()=>`<h3>Verify your email</h3><p class="sb">Enter the 6-digit code sent to ${esc(S.email)} to create your account.</p>${box()}<div class="hn bad" id="er" role="alert"></div><button class="b1" id="vb" data-act="register" disabled>Create account</button><div class="rw"><button class="lk" data-act="go" data-v="up.form">Change details</button><button class="lk" data-act="resend" id="rs">Resend code</button></div>${foot}`,
'rst.email':()=>`<h3>Reset your password</h3><p class="sb">Enter your email and we’ll send a reset code.</p><form data-f="rst" novalidate>${fld('Email','e','email','you@company.com','autocomplete="email" value="'+esc(S.email)+'"')}<div class="hn bad" id="er" role="alert"></div><button class="b1" type="submit">Send reset code</button></form><button class="lk" data-act="go" data-v="in.cred" style="align-self:center">Back to sign in</button>${foot}`,
'rst.reset':()=>`<h3>Choose a new password</h3><p class="sb">Enter the code sent to ${esc(S.email)} and set a new password.</p><form data-f="reset" novalidate>${box()}${pwf('New password','p','new-password')}<div class="hn bad" id="er" role="alert"></div><button class="b1" type="submit">Update password</button></form>${foot}`,
'oidc.run':()=>`<h3>Signing in with AYZEN</h3><p class="sb">Fyra is using AYZEN’s OpenID Connect provider.</p><ol class="os">${['Contacting AYZEN','Preparing a secure request','Redirecting to AYZEN sign-in'].map(t=>`<li><i></i><span>${t}</span></li>`).join('')}</ol><div class="hn bad" id="er" role="alert"></div><button class="b2" id="ob" hidden data-act="go" data-v="in.cred">Back to sign in</button><div class="cl">OpenID Connect, Authorization Code with PKCE</div>`,
'done':n=>`<div class="dn"><div class="ckc"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h3>${n?'Welcome, '+esc(n):'You’re in'}</h3><p class="sb" style="margin-top:8px">Opening your finance workspace…</p><div class="bar"><i></i></div></div>`};
/* --- render + bind --- */
function render(v,arg){S.v=v;clearInterval(S.t);av.classList.remove('sh');av.innerHTML=V[v](arg);bind();
 if(/otp|reset|step/.test(v))otp();if(v==='in.otp'||v==='up.otp')tick();if(v==='done')setTimeout(()=>location.href=NEXT,1500)}

function tick(){const b=$('#rs');if(!b)return;S.cd=S.cd||60;const u=()=>{b.disabled=S.cd>0;b.textContent=S.cd>0?'Resend in '+S.cd+'s':'Resend code'};u();S.t=setInterval(()=>{S.cd=Math.max(0,S.cd-1);u();if(!S.cd)clearInterval(S.t)},1000)}
function otp(){av.querySelectorAll('.otp').forEach(o=>{const bx=[...o.children],fx=o.closest('.fx'),chk=()=>{const full=[...av.querySelectorAll('.otp')].every(x=>[...x.children].every(b=>b.value));const vb=$('#vb');if(vb)vb.disabled=!full};
 bx.forEach((b,i)=>{b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'').slice(-1);if(b.value){b.classList.add('pp');setTimeout(()=>b.classList.remove('pp'),250);bx[i+1]&&bx[i+1].focus()}chk()});
 b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&bx[i-1]){bx[i-1].focus();bx[i-1].value='';chk()}if(e.key==='Enter'&&!$('#vb')?.disabled){const x=$('#vb');x&&x.click()}});
 b.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();[...t].forEach((c,k)=>bx[k]&&(bx[k].value=c));bx[Math.min(t.length,5)].focus();chk()})})})}
const code=o=>[...o.children].map(b=>b.value).join('');
function bind(){}
/* --- events --- */
av.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='go'){S.email=($('#e')||{}).value||S.email;S.cd=0;render(a.dataset.v)}
 else if(act==='ayzen')startOidc()
 else if(act==='oa'){const u=SOCIAL[a.dataset.p],n=a.dataset.p==='google'?'Google':'GitHub';if(!u)return toast(n+' sign-in is not enabled on this AYZEN deployment yet');location.href=u+(u.includes('?')?'&':'?')+'next='+encodeURIComponent(NEXT)}
 else if(act==='eye'){const i=$('#'+a.dataset.t),h=i.type==='password';i.type=h?'text':'password';a.textContent=h?'Hide':'Show'}
 else if(act==='resend'){if(S.cd>0)return;busy(a,true);const r=await api('/api/auth/send-otp',{email:S.email});busy(a,false);if(r.ok){toast('A new code is on its way');S.cd=60;tick()}else err(r.data?.error||'Could not resend the code.')}
 else if(act==='verify'){const c=code($('.otp'));busy(a,true);const r=await api('/api/auth/verify-otp',{email:S.email,code:c});busy(a,false);
  if(r.ok&&r.data&&r.data.valid)finish(S.pending);else{err(r.data?.error||'That code didn’t match.');av.querySelectorAll('.otp input').forEach(b=>b.value='');av.querySelector('.otp input').focus();a.disabled=true}}
 else if(act==='register'){const c=code($('.otp'));busy(a,true);const r=await api('/api/auth/register',{username:S.pending.u,email:S.email,password:S.pending.p,emailOtp:c});busy(a,false);
  if(r.ok&&r.data&&r.data.token)finish(r.data);else{err(r.data?.error||'Could not create the account.');a.disabled=false}}
 else if(act==='stepgo'){const fxs=[...av.querySelectorAll('.fx:not(.ok)')];busy(a,true);
  for(const f of fxs){const c=code(f.querySelector('.otp')),r=await api('/api/auth/login/step-up/verify',{challengeToken:S.step.ct,method:f.dataset.k,code:c});
   if(r.status===429){busy(a,false);S.step=null;render('in.cred');err(r.data?.error||'Too many attempts. Please sign in again.');return}
   if(!r.ok){busy(a,false);err(r.data?.error||'Verification failed.');f.querySelectorAll('.otp input').forEach(b=>b.value='');a.disabled=true;return}
   if(r.data.verified){return finish(r.data)}S.step.done=r.data.completedMethods||[...S.step.done,f.dataset.k]}
  busy(a,false);render('in.step')}});
av.addEventListener('input',e=>{if(e.target.id==='p'&&S.v==='up.form'){const n=str(e.target.value);av.querySelectorAll('#sm i').forEach((i,k)=>{i.className=k<n?'s'+Math.min(3,Math.max(1,n>=3?3:n)):''})}});
av.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,b=e.target.querySelector('.b1'),v=id=>(($('#'+id)||{}).value||'').trim();
 if(f==='login'){const em=v('e'),pw=($('#p')||{}).value;S.email=em;S.keep=$('#keep').checked;if(!emailRe.test(em))return err('Enter a valid email address.');if(!pw)return err('Enter your password.');
  busy(b,true);const r=await api('/api/auth/login',{email:em,password:pw});
  if(!r.ok||!r.data){busy(b,false);return err(r.status===0?'Could not reach the server. Try again.':'Invalid email or password.')}
  const d=r.data;if(d.requiresStepUp){busy(b,false);S.step={ct:d.challengeToken,req:d.requiredMethods||[],done:d.completedMethods||[]};return render('in.step')}
  if(!d.token||!d.user){busy(b,false);return err('Unexpected response. Try the AYZEN sign-in page.')}
  if(DEMO.includes(em.toLowerCase()))return finish(d);
  S.pending=d;const o=await api('/api/auth/send-otp',{email:em});busy(b,false);if(!o.ok)return err(o.data?.error||'Could not send the verification code.');toast('Code sent to '+em);S.cd=60;render('in.otp')}
 else if(f==='signup'){const u=v('u'),em=v('e'),pw=($('#p')||{}).value||'';S.email=em;if(!u)return err('Choose a username.');if(!emailRe.test(em))return err('Enter a valid email address.');if(pw.length<6)return err('Password needs at least 6 characters.');
  busy(b,true);const o=await api('/api/auth/send-otp',{email:em});busy(b,false);if(!o.ok)return err(o.data?.error||'Could not send the verification code.');S.pending={u,p:pw};S.cd=60;toast('Code sent to '+em);render('up.otp')}
 else if(f==='rst'){const em=v('e');S.email=em;if(!emailRe.test(em))return err('Enter a valid email address.');busy(b,true);await api('/api/auth/forgot-password',{email:em});busy(b,false);toast('If that email has an account, a code is on its way');render('rst.reset')}
 else if(f==='reset'){const c=code($('.otp')),pw=($('#p')||{}).value||'';if(c.length<6)return err('Enter the 6-digit code.');if(pw.length<6)return err('Password needs at least 6 characters.');
  busy(b,true);const r=await api('/api/auth/reset-password',{email:S.email,code:c,newPassword:pw});busy(b,false);if(!r.ok)return err(r.data?.error||'That code didn’t work.');toast('Password updated. Sign in with it now.');render('in.cred')}});


render(location.hash==='#signup'?'up.form':'in.cred');

/* --- hero: a ledger that reconciles itself --- */
const ACC=['Cash & equivalents','Accounts receivable','Consulting revenue','Payroll expense','Software subscriptions','Retained position','Office lease','Tax payable','Equipment','Interest income','Travel expense','Deferred revenue'];
let sd=11;const rn=()=>(sd=sd*16807%2147483647)/2147483647;
const E=Array.from({length:20},(_,i)=>{const a=ACC[(i*5+1)%12];let b=ACC[(i*7+4)%12];if(b===a)b=ACC[(i*7+5)%12];return{id:String(4802+i*9+Math.floor(rn()*6)).padStart(4,'0'),dr:a,cr:b,am:(300+Math.floor(rn()*9400)+Math.round(rn()*99)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}});
const trk=$('#trk'),H=44,N=E.length,LY=H*6;
trk.innerHTML=[...E,...E].map(e=>`<div class="r"><span class="id">${e.id}</span><span class="dr">${e.dr}</span><span class="cr">${e.cr}</span><span class="am">${e.am}</span></div>`).join('');
const R=[...trk.children];let act=-1;
function mark(i){if(i===act)return;if(act>=0){R[act].classList.remove('on');R[act+N].classList.remove('on')}act=i;R[i].classList.add('on');R[i+N].classList.add('on');$('#hud').innerHTML='Entry <b>'+E[i].id+'</b> matched: debit equals credit'}
let vis=true;new IntersectionObserver(e=>{vis=e[0].isIntersecting;if(vis)lp(performance.now())}).observe($('#lg'));
function lp(t){if(!vis)return;const y=(t*.024)%(N*H);trk.style.transform='translateY('+(-y).toFixed(1)+'px)';mark(Math.floor((y+LY)/H)%N);if(!red)requestAnimationFrame(lp)}
if(red){trk.style.transform='none';mark(Math.floor(LY/H))}else requestAnimationFrame(lp);
})();</script></body></html>
