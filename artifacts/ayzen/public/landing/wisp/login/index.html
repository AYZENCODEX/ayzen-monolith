<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to Wisp</title><meta name="theme-color" content="#050507">
<style>/* Sign-in portal. Everything is scoped under .zp so it cannot leak into the app theme. */
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}

.zp{
  --bg:#050507; --fg:#eaf2ff; --muted:rgba(234,242,255,.64); --dim:rgba(234,242,255,.44);
  --line:rgba(234,242,255,.12); --line-strong:rgba(234,242,255,.28);
  --teal:#5fe3d6; --violet:#8f7cff; --pink:#ff6fb5; --danger:#ff8a8a; --ok:#7fe3a8;
  --glass:rgba(12,12,20,.62); --field:rgba(234,242,255,.045);
  --iri:linear-gradient(100deg,var(--teal),var(--violet) 55%,var(--pink));
  --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  position:relative;isolation:isolate;min-height:100svh;overflow:clip;background:var(--bg);color:var(--fg);
  font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;color-scheme:dark;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.zp *,.zp *::before,.zp *::after{box-sizing:border-box}
.zp h1,.zp h2,.zp p{margin:0}
.zp-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.zp::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 40% 45%,transparent 38%,var(--bg) 100%),linear-gradient(180deg,rgba(5,5,7,.6),transparent 20%,transparent 62%,rgba(5,5,7,.9))}

/* brand column */
.zp-brand{display:flex;flex-direction:column;justify-content:space-between;padding:32px clamp(24px,4vw,56px) clamp(32px,6vh,64px)}
.zp-logo{display:flex;align-items:baseline;gap:14px;font:500 .95rem var(--sans);letter-spacing:.22em;text-decoration:none;color:var(--fg)}
.zp-logo small{font:400 .72rem var(--mono);letter-spacing:.06em;color:var(--dim)}
.zp-pitch{max-width:560px}
.zp-pitch h1{font:400 clamp(2.4rem,4.6vw,4.2rem)/1.03 var(--serif);letter-spacing:-.02em}
.zp-pitch h1 em{font-style:italic;background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent}
.zp-pitch p{margin-top:16px;color:var(--muted);max-width:46ch}
.zp-status{margin-top:22px;display:inline-flex;align-items:center;gap:.6em;font:400 .72rem var(--mono);letter-spacing:.05em;color:var(--muted)}
.zp-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:zp-blink 2.4s ease-in-out infinite}
@keyframes zp-blink{50%{opacity:.35}}

/* panel column */
.zp-stage{display:grid;place-items:center;padding:32px clamp(16px,3vw,48px)}
.zp-panel{width:min(100%,432px);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:28px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);position:relative}
.zp-panel::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;background:var(--iri);opacity:.7}
.zp-switch{position:absolute;top:-14px;right:18px}

/* tabs */
.zp-tabs{--n:2;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:3px;margin-bottom:24px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.zp-tabs button{position:relative;z-index:1;height:34px;border:0;background:none;color:var(--muted);font:500 .85rem var(--sans);border-radius:9px;cursor:pointer;transition:color .2s}
.zp-tabs button[aria-selected=true]{color:var(--fg)}
.zp-tabs button:hover{color:var(--fg)}
.zp-tabs i{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:9px;background:rgba(234,242,255,.1);box-shadow:inset 0 0 0 1px var(--line);transform:translateX(calc(var(--i)*100%));transition:transform .32s cubic-bezier(.2,.8,.2,1)}

.zp-heading{margin-bottom:20px}
.zp-heading h2{font:400 1.9rem/1.1 var(--serif);letter-spacing:-.01em}
.zp-heading p{margin-top:6px;color:var(--muted);font-size:.9rem}
.zp-form{display:grid;gap:16px}
.zp-view{animation:zp-in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes zp-in{from{opacity:0;transform:translateY(8px)}}

/* fields */
.zp-field-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.zp-field label{font:500 .82rem var(--sans);color:var(--muted)}
.zp-control{position:relative;display:flex;align-items:center}
.zp-control input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);
  font:400 .95rem var(--sans);outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.zp-control input::placeholder{color:var(--dim)}
.zp-control input:hover{border-color:var(--line-strong)}
.zp-control input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px rgba(95,227,214,.18);background:rgba(234,242,255,.06)}
.zp-field.is-invalid input{border-color:var(--danger)}
.zp-control:has(.zp-trail) input{padding-right:46px}
.zp-trail{position:absolute;right:4px;width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--dim);border-radius:8px;cursor:pointer}
.zp-trail:hover{color:var(--fg)}
.zp-trail:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.zp-trail svg{width:18px;height:18px}
.zp-hint{margin-top:6px;font-size:.78rem;color:var(--dim)}
.zp-error{margin-top:6px;font-size:.8rem;color:var(--danger)}
.zp-code input{height:56px;text-align:center;font:500 1.5rem var(--mono);letter-spacing:.5em;padding-left:.5em}
.zp-link{background:none;border:0;padding:0;color:var(--muted);font:500 .8rem var(--sans);cursor:pointer;text-decoration:none}
.zp-link:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.zp-link:disabled{opacity:.45;cursor:default;text-decoration:none}
.zp-link:focus-visible,.zp-check:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

/* checkbox */
.zp-check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;cursor:pointer;width:fit-content;background:none;border:0;padding:0;font-family:inherit}
.zp-check b{width:18px;height:18px;border-radius:5px;border:1px solid var(--line-strong);display:grid;place-items:center;transition:background .15s,border-color .15s}
.zp-check[aria-checked=true] b{background:var(--fg);border-color:var(--fg);color:#07070b}
.zp-check svg{width:12px;height:12px;stroke-width:3}

/* buttons */
.zp-btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;height:46px;padding:0 22px;border-radius:999px;border:1px solid transparent;
  font:500 .92rem var(--sans);cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,opacity .2s;color:var(--fg);background:none;text-decoration:none}
.zp-btn svg{width:17px;height:17px}
.zp-btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.zp-btn:disabled{opacity:.55;cursor:not-allowed}
.zp-block{width:100%}
.zp-solid{background:var(--fg);color:#07070b}
.zp-solid:not(:disabled):hover{transform:translateY(-1px);background:#fff}
.zp-ghost{border-color:var(--line);background:rgba(234,242,255,.03)}
.zp-ghost:not(:disabled):hover{border-color:var(--line-strong);background:rgba(234,242,255,.07)}
.zp-text{height:auto;padding:0;border-radius:6px;color:var(--muted);font-size:.8rem}
.zp-text:hover{color:var(--fg)}
.zp-spin{animation:zp-rot .8s linear infinite}
@keyframes zp-rot{to{transform:rotate(360deg)}}

.zp-divider{display:flex;align-items:center;gap:14px;margin:20px 0 16px;color:var(--dim);font-size:.78rem}
.zp-divider::before,.zp-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.zp-alt{display:grid;gap:10px}

/* notices */
.zp-notice{display:flex;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--field)}
.zp-notice-icon{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(95,227,214,.12);color:var(--teal)}
.zp-notice-icon svg{width:17px;height:17px}
.zp-notice-title{font:500 .88rem var(--sans)}
.zp-notice-body{margin-top:2px;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.zp-notice-warn{border-color:rgba(255,138,138,.3)}.zp-notice-warn .zp-notice-icon{background:rgba(255,138,138,.12);color:var(--danger)}
.zp-notice-ok{border-color:rgba(127,227,168,.3)}.zp-notice-ok .zp-notice-icon{background:rgba(127,227,168,.12);color:var(--ok)}
.zp-row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* step-up */
.zp-steps{display:grid;gap:10px}
.zp-step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,background .2s}
.zp-step.is-done{border-color:rgba(127,227,168,.35);background:rgba(127,227,168,.05)}
.zp-step-head{display:flex;justify-content:space-between;align-items:center;font:500 .88rem var(--sans)}
.zp-step-head em{font:400 .75rem var(--mono);font-style:normal;color:var(--ok)}
.zp-step-body{display:flex;gap:8px;margin-top:10px}
.zp-step-body input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:500 1rem var(--mono);letter-spacing:.3em;text-align:center;outline:0}
.zp-step-body input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px rgba(95,227,214,.18)}
.zp-step-body .zp-btn{height:40px;padding:0 16px;font-size:.85rem}

/* account chooser */
.zp-accounts{display:grid;gap:6px;margin-bottom:14px}
.zp-account{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px;transition:border-color .2s,background .2s}
.zp-account:hover{border-color:var(--line-strong);background:rgba(234,242,255,.04)}
.zp-account>button:first-child{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;border-radius:9px;font:inherit}
.zp-account>button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.zp-avatar{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--iri);color:#07070b;font:600 .85rem var(--sans);text-transform:uppercase}
.zp-account strong{display:block;font:500 .9rem var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zp-account small{display:block;font-size:.76rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zp-account .zp-x{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--dim);border-radius:8px;cursor:pointer}
.zp-account .zp-x:hover{color:var(--danger)}
.zp-account .zp-x svg{width:15px;height:15px}

/* developer access */
.zp-dev{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.zp-dev summary{cursor:pointer;list-style:none;color:var(--dim);font:400 .78rem var(--sans);display:flex;align-items:center;gap:8px;width:fit-content}
.zp-dev summary::-webkit-details-marker{display:none}
.zp-dev summary::after{content:"+";font:500 1rem var(--mono)}
.zp-dev[open] summary::after{content:"–"}
.zp-dev summary:hover{color:var(--fg)}
.zp-dev summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.zp-dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.zp-dev-grid .zp-btn{height:38px;font-size:.8rem;padding:0 10px}
.zp-dev-grid .zp-btn:last-child{grid-column:1/-1}

.zp-foot{margin-top:24px;text-align:center;font-size:.85rem;color:var(--muted)}
.zp-foot button{background:none;border:0;padding:0;color:var(--fg);font:500 inherit var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.zp-foot button:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.zp-assure{margin-top:14px;text-align:center;font:400 .72rem var(--mono);color:var(--dim);letter-spacing:.02em}
.zp-boot{min-height:100svh;display:grid;place-items:center;background:#050507}
.zp-boot i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(234,242,255,.15);border-top-color:#5fe3d6;animation:zp-rot .8s linear infinite}
.zp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stepper */
.zp-stepper{margin-bottom:22px}
.zp-stepper ol{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.zp-stepper li{height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.zp-stepper li.is-done{background:var(--line-strong)}
.zp-stepper li.is-now{background:var(--iri)}
.zp-stepper p{font:400 .78rem var(--mono);color:var(--dim)}
.zp-suffix{position:absolute;right:14px;color:var(--dim);font:400 .85rem var(--mono);pointer-events:none}
.zp-control:has(.zp-suffix) input{padding-right:118px}
.zp-status-line{margin-top:6px;font-size:.8rem;min-height:1.2em;color:var(--dim)}
.zp-status-line.ok{color:var(--ok)}.zp-status-line.bad{color:var(--danger)}
.zp-mail{margin-top:6px;font:500 .82rem var(--mono);color:var(--muted);overflow-wrap:anywhere}

@media (max-width:899px){
  .zp{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .zp-brand{padding:22px 20px 0;gap:0}
  .zp-pitch{display:none}
  .zp-stage{align-items:start;padding:min(34svh,260px) 16px 32px}
  .zp-panel{padding:22px 20px}
  .zp-control input{font-size:16px}
  .zp-tabs button{font-size:.8rem}
}
@media (max-width:899px) and (max-height:700px){.zp-stage{padding-top:180px}}
@media (prefers-reduced-motion:reduce){
  .zp-view,.zp-status::before,.zp-spin{animation:none!important}
  .zp *{transition:none!important}
}

.zp-demo-tag{position:fixed;left:16px;bottom:16px;z-index:5;font:400 .72rem var(--mono,monospace);color:rgba(234,242,255,.5)}
.zp-toast{position:fixed;right:20px;bottom:20px;z-index:10;background:#0c0c14;border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:320px;font-size:.88rem;animation:zp-in .25s;color:var(--fg)}
.zp-toast.bad{border-color:rgba(255,138,138,.4)}
.zp-ok-screen{display:grid;place-items:center;text-align:center;gap:12px;padding:30px 0}
.zp-ok-screen svg{width:44px;height:44px;color:var(--ok)}
</style></head>
<body style="margin:0;background:#050507">
<div class="zp">
<canvas id="bg" class="zp-canvas" aria-hidden="true"></canvas>
<section class="zp-brand" aria-label="About AYZEN"><a class="zp-logo" href="../"><span>WISP</span><small>AYZEN mail</small></a>
<div class="zp-pitch"><h1>Mail at your<br><em>own address.</em></h1><p>Sign in to read, sort and send from your name@ayzen.tech address. Your AYZEN account works across every module.</p><div class="zp-status">Passkeys, email codes and new-location checks</div></div></section>
<main class="zp-stage"><div class="zp-panel" id="panel"></div></main>
<div class="zp-demo-tag">Design preview, not connected to a server: any 6-digit code works.</div>
</div>
<script>
(function(){
const nodes=[["sylo","#5FE3D6"],["skarn","#8F7CFF"],["warde","#7CC4FF"],["wisp","#FF6FB5"],["ryft","#FFB86B"],["fyra","#9BE37C"],["verve","#C58CFF"],["zynth","#EAF2FF"]];
const cv=document.getElementById("bg"),ctx=cv.getContext("2d"),TAU=Math.PI*2,CORE="#EAF2FF";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};
const spr=new Map();const sprite=h=>{let s=spr.get(h);if(!s){s=document.createElement("canvas");s.width=s.height=96;const g=s.getContext("2d"),r=g.createRadialGradient(48,48,0,48,48,48);r.addColorStop(0,rgba(h,.95));r.addColorStop(.18,rgba(h,.55));r.addColorStop(1,rgba(h,0));g.fillStyle=r;g.fillRect(0,0,96,96);spr.set(h,s)}return s};
const n=nodes.length;const base=nodes.map((_,i)=>{const a=i/n*TAU;return{x:Math.cos(a),y:(i%2?.34:-.34)+Math.sin(a*2)*.1,z:Math.sin(a)}});
const packets=[];const spawn=()=>packets.push({s:Math.floor(Math.random()*n),t:0,v:.12+Math.random()*.16,d:Math.random()<.5?1:-1});
for(let i=0;i<5;i++){spawn();packets[i].t=Math.random()}
const dust=Array.from({length:70},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random(),s:.4+Math.random()*1.1}));
let w,h,dpr;const resize=()=>{dpr=Math.min(devicePixelRatio||1,2);w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
const ptr={x:0,y:0,tx:0,ty:0};addEventListener("pointermove",e=>{ptr.tx=(e.clientX/innerWidth-.5)*2;ptr.ty=(e.clientY/innerHeight-.5)*2},{passive:true});
let spin=.6,last=0,run=false,raf=0;
function draw(yaw,tilt,dt){ctx.clearRect(0,0,w,h);const wide=w>=900,cx=wide?w*.36:w*.5,cy=h*(wide?.38:.21),R=wide?Math.min(w*.24,h*.27):Math.min(w*.34,h*.13),P=3.2;
ctx.fillStyle="rgba(234,242,255,.5)";for(const d of dust){if(!reduce){d.y-=dt*.004*(.4+d.z);if(d.y<-1.05)d.y=1.05}ctx.globalAlpha=.1+d.z*.35;ctx.fillRect(w*.5+(d.x+ptr.x*.03*d.z)*w*.52,h*.5+d.y*h*.52,d.s,d.s)}ctx.globalAlpha=1;
const cY=Math.cos(yaw),sY=Math.sin(yaw),cX=Math.cos(.42+tilt),sX=Math.sin(.42+tilt);
const pr=base.map(p=>{const x1=p.x*cY-p.z*sY,z1=p.x*sY+p.z*cY,y2=p.y*cX-z1*sX,z2=p.y*sX+z1*cX,k=P/(P+z2);return{sx:cx+x1*R*k,sy:cy+y2*R*k,z:z2}});
ctx.lineWidth=1;for(let i=0;i<n;i++){const a=pr[i],b=pr[(i+1)%n];ctx.strokeStyle="rgba(234,242,255,.07)";ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();const g=ctx.createLinearGradient(cx,cy,a.sx,a.sy);g.addColorStop(0,"rgba(234,242,255,.22)");g.addColorStop(1,rgba(nodes[i][1],.16+(1-(a.z+1)/2)*.1));ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(a.sx,a.sy);ctx.stroke()}
if(!reduce)for(let i=packets.length-1;i>=0;i--){const p=packets[i];p.t+=dt*p.v;if(p.t>=1){packets.splice(i,1);spawn()}}
for(const p of packets){const a=pr[p.s],t=p.d===1?p.t:1-p.t;ctx.globalAlpha=Math.sin(p.t*Math.PI);ctx.drawImage(sprite(nodes[p.s][1]),cx+(a.sx-cx)*t-9,cy+(a.sy-cy)*t-9,18,18)}ctx.globalAlpha=1;
const pu=reduce?1:1+Math.sin(performance.now()/900)*.06;ctx.drawImage(sprite(CORE),cx-34*pu,cy-34*pu,68*pu,68*pu);ctx.fillStyle=CORE;ctx.beginPath();ctx.arc(cx,cy,3.4,0,TAU);ctx.fill();
ctx.font="500 11px 'JetBrains Mono',monospace";ctx.textBaseline="middle";
for(const i of pr.map((_,i)=>i).sort((i,j)=>pr[j].z-pr[i].z)){const p=pr[i],dp=1-(p.z+1)/2,W=nodes[i][0]==="wisp",sz=(30+dp*26)*(W?1.7:1);ctx.globalAlpha=.45+dp*.55;ctx.drawImage(sprite(nodes[i][1]),p.sx-sz/2,p.sy-sz/2,sz,sz);ctx.fillStyle=nodes[i][1];ctx.beginPath();ctx.arc(p.sx,p.sy,2.2+dp*2,0,TAU);ctx.fill();ctx.fillStyle=W?"#FF9CCB":"rgba(234,242,255,.78)";if(W)ctx.font="600 13px 'JetBrains Mono',monospace";ctx.fillText(nodes[i][0],p.sx+12+dp*4,p.sy);if(W)ctx.font="500 11px 'JetBrains Mono',monospace"}ctx.globalAlpha=1}
function frame(now){const dt=last?Math.min((now-last)/1e3,.05):0;last=now;if(!reduce){spin+=dt*.09;ptr.x+=(ptr.tx-ptr.x)*Math.min(1,dt*3);ptr.y+=(ptr.ty-ptr.y)*Math.min(1,dt*3)}draw(spin+ptr.x*.12,ptr.y*.08,dt);if(run)raf=requestAnimationFrame(frame)}
const start=()=>{if(run||reduce||document.hidden)return;run=true;last=0;raf=requestAnimationFrame(frame)},stop=()=>{run=false;cancelAnimationFrame(raf)};
new ResizeObserver(()=>{resize();if(!run)draw(spin,0,0)}).observe(cv);resize();draw(spin,0,0);document.addEventListener("visibilitychange",()=>document.hidden?stop():start());start();
})();
</script>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);const root=$("#panel");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t,bad){const e=document.createElement("div");e.className="zp-toast"+(bad?" bad":"");e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
const eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const fp='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v4M8 21c0-3 1-6 1-9a3 3 0 016 0c0 3 1 6 1 9M5 18c.7-2 1-4 1-6a6 6 0 0112 0c0 2 .3 4 1 6"/></svg>';
const field=(o)=>`<div class="zp-field${o.cls?" "+o.cls:""}"><div class="zp-field-row"><label for="${o.id}">${o.label}</label>${o.aside||""}</div><div class="zp-control"><input id="${o.id}" name="${o.id}" type="${o.type||"text"}" ${o.attrs||""} value="${esc(o.value||"")}" placeholder="${o.ph||""}">${o.trail||""}</div>${o.hint?`<p class="zp-hint">${o.hint}</p>`:""}</div>`;
const btn=(t,o={})=>`<button class="zp-btn zp-${o.v||"solid"}${o.block===false?"":" zp-block"}" ${o.id?`id="${o.id}"`:""} type="${o.type||"button"}">${t}</button>`;
const head=(t,s)=>`<header class="zp-heading"><h2>${t}</h2>${s?`<p>${s}</p>`:""}</header>`;
const Q=new URLSearchParams(location.search);const U0=(Q.get("username")||"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);const S={tab:Q.get("tab")==="signup"?"up":"in",su:0,email:"",pw:"",ref:"",user:U0,name:"",mail:U0,mailTouched:false,cap:null,li:null};
const STEPS=["Account","Security check","Verify email","Identity","Profile"];
const mk=()=>{const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);return{q:a+" × "+b,a:a*b}};
function tabs(){return `<div class="zp-tabs" role="tablist" style="--i:${S.tab==="in"?0:1}"><i></i><button role="tab" aria-selected="${S.tab==="in"}" data-tab="in">Sign in</button><button role="tab" aria-selected="${S.tab==="up"}" data-tab="up">Sign up</button></div>`}
function stepper(){return `<nav class="zp-stepper"><ol>${STEPS.map((l,i)=>`<li class="${i<S.su?"is-done":i===S.su?"is-now":""}"></li>`).join("")}</ol><p>Step ${S.su+1} of 5: ${STEPS[S.su]}</p></nav>`}
const passBtn=(id)=>`<button type="button" class="zp-trail" id="${id}" aria-label="Show password">${eye}</button>`;
function bindPass(id,inp){const b=$("#"+id),i=$("#"+inp);b.onclick=()=>{i.type=i.type==="password"?"text":"password"}}
function view(html,showTabs){root.innerHTML=(showTabs?tabs():"")+`<div class="zp-view">${html}</div>`+(S.li&&S.li.step?"":`<p class="zp-foot">${S.tab==="in"?'New to AYZEN? <button data-tab="up">Sign up</button>':'Already have an account? <button data-tab="in">Sign in</button>'}</p>`);root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.li=null;render()});}
const val=id=>$("#"+id).value;
function render(){S.tab==="in"?(S.li&&S.li.step?stepup():signin()):signup()}
/* ---- sign in ---- */
function signin(){view(`<form class="zp-form" id="f">${head("Welcome back","Enter your email and password. We'll verify it's you next.")}${field({id:"email",label:"Email",type:"email",value:S.email,ph:"you@company.com",attrs:"required autocomplete=username"})}${field({id:"pw",label:"Password",type:"password",value:S.pw,attrs:"required minlength=6",aside:'<a class="zp-link" href="#" onclick="return false">Forgot password?</a>',trail:passBtn("eye")})}${btn("Continue",{type:"submit"})}</form>
<div class="zp-divider"><span>or continue with</span></div><div class="zp-alt">${btn(fp+"Passkey",{v:"ghost",id:"pk"})}</div>`,true);bindPass("eye","pw");
$("#f").onsubmit=async e=>{e.preventDefault();S.email=val("email");S.pw=val("pw");const b=$("#f .zp-btn");b.disabled=true;b.innerHTML="Checking…";await sleep(700);
S.li={step:true,req:["email_otp","totp","passkey"],done:[],t:0};toast("Check your email. We sent a code (demo: any 6 digits).");render()};
$("#pk").onclick=()=>toast("Passkey prompt would open here (demo).")}
const LBL={email_otp:"Email code",totp:"Authenticator app (2FA)",passkey:"Passkey"};
function stepup(){const L=S.li;const done=m=>L.done.includes(m);
view(`<div class="zp-form">${head("Verify it's you","Your password was correct. Finish each check below to sign in.")}
<div class="zp-notice"><div class="zp-notice-icon">${fp}</div><div><p class="zp-notice-title">${L.done.length} of ${L.req.length} verified</p><p class="zp-notice-body">The email code is always required. Authenticator and passkey checks appear if you set them up.</p></div></div>
<div class="zp-steps">${L.req.map(m=>`<div class="zp-step${done(m)?" is-done":""}"><div class="zp-step-head"><span>${LBL[m]}</span>${done(m)?"<em>Verified</em>":""}</div>${done(m)?"":m==="passkey"?`<div class="zp-step-body"><button type="button" class="zp-btn zp-ghost zp-block" data-pk>${fp} Verify with passkey</button></div>`:`<div class="zp-step-body"><input data-code="${m}" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="${LBL[m]}"><button type="button" class="zp-btn zp-ghost" data-v="${m}">Verify</button></div>`}</div>`).join("")}</div>
<button type="button" class="zp-btn zp-text" id="back">← Back to sign in</button></div>`,false);
root.querySelectorAll("[data-code]").forEach(i=>i.oninput=()=>i.value=i.value.replace(/\D/g,""));
root.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const i=$(`[data-code="${b.dataset.v}"]`);if(i.value.length!==6){toast("Enter the 6-digit code.",true);return}L.done.push(b.dataset.v);after()});
const pkb=$("[data-pk]");if(pkb)pkb.onclick=async()=>{pkb.textContent="Waiting for passkey…";await sleep(900);L.done.push("passkey");after()};
$("#back").onclick=()=>{S.li=null;render()}}
async function after(){if(S.li.done.length===S.li.req.length){success("Account verified!","You're signed in. In the app you'd land in your mailbox.")}else stepup()}
function success(t,s){root.innerHTML=`<div class="zp-ok-screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><h2 style="font:400 1.9rem var(--serif)">${t}</h2><p style="color:var(--muted)">${s}</p><button class="zp-btn zp-ghost" id="again">Restart demo</button></div>`;$("#again").onclick=()=>{Object.assign(S,{tab:"in",su:0,email:"",pw:"",ref:"",user:"",name:"",mail:"",mailTouched:false,li:null});render()}}
/* ---- sign up ---- */
function signup(){const n=S.su;let h="";
if(n===0)h=`<form class="zp-form" id="f">${head("Create your account","Start with your email and a password.")}${field({id:"email",label:"Email",type:"email",value:S.email,ph:"you@company.com",attrs:"required autocomplete=email"})}${field({id:"pw",label:"Password",type:"password",value:S.pw,attrs:"required minlength=6 autocomplete=new-password",hint:"At least 6 characters.",trail:passBtn("eye")})}${btn("Continue",{type:"submit"})}</form>`;
if(n===1){if(!S.cap)S.cap=mk();h=`<form class="zp-form" id="f">${head("One quick check","Add a referral code if you have one, then prove you're human. We email a code next.")}${field({id:"ref",label:"Referral code (optional)",value:S.ref,ph:"AYZNXXXXXX",attrs:'autocapitalize=characters spellcheck=false'})}${field({id:"cap",label:"Security check: "+S.cap.q+" = ?",type:"number",ph:"Your answer",attrs:"required inputmode=numeric",aside:'<button type="button" class="zp-link" id="newq">New question</button>'})}${btn("Send verification code",{type:"submit"})}${btn("← Back",{v:"text",id:"back",block:false})}</form>`}
if(n===2)h=`<form class="zp-form" id="f">${head("Verify your email")}<div class="zp-notice zp-notice-ok"><div><p class="zp-notice-title">Code sent to</p><p class="zp-notice-body">${esc(S.email)}. Demo: any 6 digits work.</p></div></div>${field({id:"code",label:"6-digit code",cls:"zp-code",ph:"······",attrs:'maxlength=6 inputmode=numeric autocomplete=one-time-code required'})}${btn("Verify email",{type:"submit"})}<div class="zp-row"><button type="button" class="zp-link" id="back">← Change email</button><button type="button" class="zp-link" id="resend">Resend code</button></div></form>`;
if(n===3)h=`<form class="zp-form" id="f">${head("Choose your identity","Your username also becomes your AYZEN mail address.")}<div>${field({id:"user",label:"Username",value:S.user,ph:"your_handle",attrs:'required minlength=3 autocapitalize=none spellcheck=false'})}<p class="zp-status-line" id="us">3-30 lowercase letters, numbers or underscores.</p></div>${field({id:"name",label:"Full name",value:S.name,ph:"Your name",attrs:"required maxlength=60"})}<div>${field({id:"mail",label:"AYZEN mail address",value:S.mail,attrs:"autocapitalize=none spellcheck=false",trail:'<span class="zp-suffix">@ayzen.tech</span>'})}<p class="zp-status-line" id="ms"></p></div>${btn("Create account",{type:"submit",id:"go"})}</form>`;
if(n===4)h=`<form class="zp-form" id="f">${head("Finish your profile","Everything here is optional. You can change it later.")}${field({id:"loc",label:"Location",ph:"City, country"})}${field({id:"bio",label:"Short bio",ph:"What you work on",attrs:"maxlength=300"})}${field({id:"x",label:"X (Twitter) handle",ph:"@handle"})}${field({id:"tg",label:"Telegram username",ph:"@handle"})}${field({id:"dc",label:"Discord",ph:"username"})}${field({id:"web",label:"Website",type:"url",ph:"https://"})}${btn("Save and continue",{type:"submit"})}${btn("Skip for now",{v:"ghost",id:"skip"})}</form>`;
view((n<4?"":"")+stepper()+h,n<4);if(n===4){/* hide tabs on profile */}
if(n===0)bindPass("eye","pw");
const f=$("#f");
f.onsubmit=async e=>{e.preventDefault();
if(n===0){if(val("pw").length<6){toast("Use at least 6 characters.",true);return}S.email=val("email");S.pw=val("pw");S.su=1;signup()}
else if(n===1){S.ref=val("ref").toUpperCase();if(+val("cap")!==S.cap.a){toast("That answer is wrong. Try the new question.",true);S.cap=mk();signup();return}S.cap=null;S.su=2;toast("Code sent to "+S.email);signup()}
else if(n===2){if(val("code").length!==6){toast("Enter the 6-digit code.",true);return}S.su=3;signup()}
else if(n===3){S.user=val("user");S.name=val("name");S.mail=val("mail");$("#go").textContent="Creating…";await sleep(900);S.su=4;toast(S.mail+"@ayzen.tech is yours.");signup()}
else{success("Account created!","Welcome, "+esc(S.name||S.user)+". In the app you'd land in your mailbox.")}};
if(n===1){$("#newq").onclick=()=>{S.cap=mk();signup()};$("#back").onclick=()=>{S.su=0;signup()}}
if(n===2){$("#back").onclick=()=>{S.su=0;signup()};$("#resend").onclick=()=>toast("Code resent.");$("#code").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"")}
if(n===4)$("#skip").onclick=()=>success("Account created!","Welcome, "+esc(S.name||S.user)+". In the app you'd land in your mailbox.");
if(n===3){const u=$("#user"),m=$("#mail"),us=$("#us"),ms=$("#ms");let tu,tm;
const TAKEN=["taken","admin","root","wisp","ayzen","support"];
const chk=(el,v,box,mail)=>{clearTimeout(mail?tm:tu);if(v.length<3){box.className="zp-status-line";box.textContent=mail?"At least 3 characters.":"3-30 lowercase letters, numbers or underscores.";return}box.className="zp-status-line";box.textContent="Checking…";const t=setTimeout(()=>{const bad=TAKEN.includes(v);box.className="zp-status-line "+(bad?"bad":"ok");box.textContent=bad?(mail?"Already taken.":"That username is taken."):(mail?v+"@ayzen.tech is available.":"Available.")},350);mail?tm=t:tu=t};
u.oninput=()=>{u.value=u.value.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);S.user=u.value;if(!S.mailTouched){m.value=u.value.replace(/[^a-z0-9._-]/g,"");S.mail=m.value;chk(m,m.value,ms,true)}chk(u,u.value,us,false)};
m.oninput=()=>{S.mailTouched=true;m.value=m.value.toLowerCase().replace(/[^a-z0-9._-]/g,"").slice(0,30);S.mail=m.value;chk(m,m.value,ms,true)};
if(u.value)u.oninput()}}
render();
})();
</script>
